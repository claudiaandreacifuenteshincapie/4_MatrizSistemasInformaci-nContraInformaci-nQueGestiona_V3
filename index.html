cia", "Etapa 2"], [10, "Dirección Calidad y Redes de Servicios de Salud", "Gestion Inventarios ESES", "Crear funcionalidaddes para cargue masivo de informacion de los inventarios (cada uno proveniente de un archivo generado por el software que utiliza la ESE", 1, "Desarrollar SSSA - Practicantes", "Claudia Cifuentes", "Practicantes Excelencia"], [11, "Dirección Calidad y Redes de Servicios de Salud", "Módulo Juntas Directivas ESE", "Crear funcionalidaddes para cargar y consultar información respecto de la conformación y funcionamiento de las juntas directivas", 1, "Desarrollar SSSA/Contratar", "Equipo", "Etapa 1"], [12, "Dirección Calidad y Redes de Servicios de Salud", "Monitoreo y seguimiento de proyectos", "Crear funcionalidades para monitorear y hacer seguimiento a los diferentes proyectos de dotación financiados por la Dirección de Calidad y Redes", 0, "Solicitud Cerrada.\nPorque este tema lo está desarrollando un practicante en Power APPS", "Patricia", "N/A"], [13, "Dirección Calidad y Redes de Servicios de Salud", "PAMEC", "Crear funcionalidades para reportar y hacer seguimiento de las actividades del PAMEC por parte de los municipios y del departamento de Antioquia", 0, "Solicitud Cerrada:\nLa Lider Funcional no dio respuesta para continuar construyendo la documentacion", "Claudia Cifuentes", "Etapa 2"], [14, "Dirección Salud Ambiental y Factores de Riesgo", "Contratación", "Se requiere un sistema de información de Inspección, vigilancia y control a establecimientos, que permita el proceso sancionatorio y que se integre con el sistema MERCURIO para la radicación y expediente electrónico de establecimientos.", 0, "Contratar Solucion Existente", "N/A", "Gestiona Direccion de Salud Ambiental y Factores de Riesgo"], [15, "Dirección Salud Ambiental y Factores de Riesgo", "Contratación", "Se requiere un sistema de información que administre toda la información relacionada con el proyecto de Zoonosis, con relación a los componentes: \n\nVacunación antirrábica de caninos y felinos: este componente requiere capturar variables como, subregión, municipio, barrio, vereda, corregimiento, lugar del evento, fecha del evento, nombre completo del propietario de la mascota, número de identificación, cantidad de caninos y felinos vacunados, sexo, color, edad, fecha de vencimiento del lote de la vacuna, número de lote de la vacuna, número chip de la mascota, entre otras. Este componente debe permitir el registro de información por los 125 municipios del departamento de Antioquia y se requiere que contemple las funciones básicas de un sistema información como insertar registros, modificar registros y eliminar registros, de acuerdo a los roles de seguridad que se autorice. Este componente debe permitir la importación de los datos (archivo plano, Excel, etc), de aquellos municipios que tienen sus propios sistemas de información o que no requieran usar este. \n\nEsterilización: este componente requiere capturar variables como, subregión, municipio, barrio, vereda, corregimiento, lugar del evento, fecha del evento, nombre completo del propietario de la mascota, número de identificación, cantidad de caninos y felinos esterilizados, sexo, color, edad, número chip de la mascota, entre otras. Este componente debe permitir el registro de información por los 125 municipios del departamento de Antioquia y se requiere que contemple las funciones básicas de un sistema información como insertar registros, modificar registros y eliminar registros, de acuerdo a los roles de seguridad que se autorice. Este componente debe permitir la importación de los datos (archivo plano, Excel, etc), de aquellos municipios que tienen sus propios sistemas de información o que no requieran usar este.\n\nVigilancia actividad: en el sistema requerido se debe implementar los formatos actuales de la vigilancia de la rabia. Este componente debe permitir el registro de información por los 125 municipios del departamento de Antioquia y se requiere que contemple las funciones básicas de un sistema información como insertar registros, modificar registros y eliminar registros, de acuerdo a los roles de seguridad que se autorice. Este componente debe permitir la importación de los datos (archivo plano, Excel, etc.), de aquellos municipios que tienen sus propios sistemas de información o que no requieran usar este.\n", 0, "Contratar Solucion Existente", "N/A", "Gestiona Direccion de Salud Ambiental y Factores de Riesgo"], [16, "Dirección Salud Ambiental y Factores de Riesgo", "Contratación", "Se requiere un sistema de información que administre el movimiento de los medicamentos de las ETV, desde su ingreso al almacén hasta su distribución final al paciente por parte de la Institución prestadora de servicios de salud, con el fin de dar cumplimiento al reporte de información al Ministerio de Salud y Protección Social.", 0, "Contratar Solucion Existente", "N/A", "Gestiona Direccion de Salud Ambiental y Factores de Riesgo"], [17, "Dirección Salud Colectiva", "Programacion Aprobacion Y Seguimiento Asistencias Tecnicas", "Contar con un software que de respuesta a la posibilidad de programar, aprobar y hacer seguimiento a las actividades, eventos, jornadas, brigadas, asesorias y asistencias tecnicas que permita la cronologia ordenada y simultanea, evitando a toda costa la coincidencia inoportuna en los territorios y con los actores locales. Asi tambien que permita hacer seguimiento a las novedades presentadas en dicha programacion, es decir, si la actividad está programada y es necesario aplazarla, reprogramarla y/o cancelarla, se pueda verificar fechas y causas.", 0, "Solicitud Cerrada\n\nPorque este tema lo cubre la plataforma AOAT de la Gobernacion", "N/A", "N/A"], [18, "Dirección Salud Colectiva", "Sistematizacion Herramientas de Autoevaluacion e indicadores (IAAS-RAM)", "tabular de manera automática los resultados de las autoevaluaciones de control de infecciones, higiene de mano y PROA, provenientes de cada una de las instituciones del departame try{if(id){const r=S.recs.find(x=>x.id==id),p={upd:TODAY},hs=[];FL.forEach(([k,n])=>{if(String(r[k]??'')!==String(d[k]??'')){hs.push({f:now,u:me(),c:n,a:tx(r[k]),n:tx(d[k])});p[k]=d[k]}});
if(hs.length)p.hist=firebase.firestore.FieldValue.arrayUnion(...hs);await C().doc(String(id)).update(p);hs.forEach(h=>logE({...h,id:r.id}))}
else{let nid=Math.max(0,...S.recs.map(x=>x.id))+1;const mk=n=>({...norm([n,'','','',0,'','','']),...d,id:n,accionOrig:'',respOrig:'',reg:TODAY,upd:TODAY,activo:true,hist:[]});
for(;;){try{await db.runTransaction(async t=>{const ref=C().doc(String(nid));if((await t.get(ref)).exists)throw 'dup';t.set(ref,clean(mk(nid)))});break}catch(x){if(x==='dup')nid++;else throw x}}logE(lg(nid,'Registro','','Creado'))}
toast('Registro guardado');if(mode==2)form();else close()}catch(x){er(x);$('#er').textContent=''}}
function confirmDel(id){const r=S.recs.find(x=>x.id==id);if(!r.activo){C().doc(String(r.id)).update({activo:true,upd:TODAY}).then(()=>{logE(lg(r.id,'Registro','Inactivo','Activo'));toast('Registro restaurado')},er);return}
modal(`<h2>¿Eliminar la necesidad #${r.id}?</h2><p>${e(r.sis)}</p><p class="mut">Pasa a inactivo: no se pierde información y puedes restaurarla con “Ver inactivos”.</p><div class="ft"><button class="btn d" data-yes="${r.id}">Sí, eliminar</button><button class="btn" data-act="close">Cancelar</button></div>`)}
function quality(){const a=act(),open=a.filter(r=>!['Solicitud cerrada','Descartada','Finalizada'].includes(r.estado));const sk=r=>(r.sis+'|'+r.dir).toLowerCase().replace(/\s+/g,' ');const kc=cnt(a,sk);
const C=[['Registros sin responsable','naranja',open.filter(r=>!r.resp)],['Registros sin prioridad (nivel)','amarillo',open.filter(r=>!r.nivel)],['Registros sin etapa','amarillo',open.filter(r=>r.etapa=='Sin etapa definida')],['Registros sin observaciones','gris',open.filter(r=>na(r.obs))],['Pendientes de información','naranja',a.filter(r=>r.estado=='Pendiente de información')],['Registros duplicados','rojo',a.filter(r=>kc[sk(r)]>1)],['Información incompleta','rojo',a.filter(r=>!r.dir||!r.sis||!r.nec||!r.accion)]];
return{C,alertas:C.reduce((s,c)=>s+c[2].length,0)}}
function vCal(){const q=quality();return head('Calidad de la información','Alertas sobre registros abiertos; las solicitudes cerradas no cuentan como faltantes')+`<div class="q">${q.C.map(([t,c,L],i)=>`<div class="card t-${L.length?c:'verde'}"><span class="badge t-${L.length?c:'verde'}">${L.length?'⚠ Revisar':'✔ Sin alertas'}</span><p style="margin:8px 0 0">${t}</p><b>${L.length}</b><br>${L.length?`<button class="btn s" data-q="${i}">Ver registros</button>`:''}</div>`).join('')}</div>`}
function vRep(){const n=list().length;return head('Reportes y exportación',`Los archivos respetan los filtros de la matriz: ahora ${n} registros`)+`<div class="card" style="margin-bottom:14px"><div class="bar">${expBtns()}</div><p class="mut">Para exportar solo un grupo (por ejemplo, necesidades priorizadas), aplica los filtros en la matriz y vuelve aquí.</p></div><div class="card"><h3>Historial de cambios</h3>${S.log.length?`<div class="tw"><table style="min-width:640px"><thead><tr><th>Fecha</th><th>Usuario</th><th>ID</th><th>Campo</th><th>Anterior</th><th>Nuevo</th></tr></thead><tbody>${S.log.map(h=>`<tr><td>${h.f.slice(0,16).replace('T',' ')}</td><td>${e(h.u)}</td><td>${h.id}</td><td>${e(h.c)}</td><td>${e(h.a)}</td><td>${e(h.n)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mut">Aún no hay modificaciones. Aparecerán aquí al editar o crear registros.</p>'}</div>`}
function vCfg(){const L=(k,t)=>`<div class="card"><h3>${t}</h3><div class="chip" style="flex-wrap:wrap">${S.cat[k].map(x=>bd(e(x),'azul')).join(' ')}</div><form class="bar" data-add="${k}"><input name="v" placeholder="Agregar opción…" required aria-label="Agregar a ${t}"><button class="btn">Agregar</button></form></div>`;
return head('Configuración','Listas desplegables del formulario')+`<div class="grid">${L('acc','Acciones')}${L('dir','Direcciones / Subsecretarías')}${L('resp','Responsables')}</div><div class="card" style="margin-top:14px"><h3>Datos</h3><p class="mut">Los cambios se guardan en la nube y se sincronizan al instante entre usuarios. Exporta a Excel para hacer respaldos periódicos.</p></div>`}
const COLS=r=>({'#':r.id,'Subsecretaría/Dirección':r.dir,'Información (sistema/proceso)':r.sis,'Necesidades':r.nec,'Necesidad priorizada':r.pri?1:0,'Nivel de prioridad':r.nivel,'Justificación':r.just,'Acción':r.accion,'Acción (texto original)':r.accionOrig,'Apoya / Responsable':r.resp||r.respOrig,'Observaciones':r.obs,'Comentarios':r.com,'Próximos pasos':r.prox,'Etapa':r.etapa,'Estado':r.estado,'Fecha de registro':r.reg,'Fecha de actualización':r.upd,'Activo':r.activo?'Sí':'No'});
function dl(name,data){const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function xlsx(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(list().map(COLS)),'Matriz');dl('Matriz_Necesidades_SI.xlsx',new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]))}
function pdf(full){const L=list(),d=new jspdf.jsPDF({orientation:'landscape'});d.setFontSize(15);d.text('Matriz de Necesidades de Sistemas de Información',14,16);d.setFontSize(9);d.text('Secretaría de Salud e Inclusión Social · '+TODAY+' · '+L.length+' registros',14,22);let y=28;
if(full){const t=(n,o)=>{d.autoTable({startY:y,head:[[n,'Cantidad']],body:Object.entries(o),theme:'grid',headStyles:{fillColor:[18,74,124]},styles:{fontSize:8},margin:{left:14,right:150}});y=d.lastAutoTable.finalY+6};t('Por estado',cnt(L,r=>r.estado));t('Por acción',cnt(L,r=>r.accion));t('Por Dirección',cnt(L,r=>r.dir));d.addPage();y=14}
d.autoTable({startY:y,head:[['ID','Dirección','Sistema / Información','Prioridad','Acción','Responsable','Estado','Etapa','Actualización']],body:L.map(r=>[r.id,r.dir,r.sis,(r.nivel||'Sin nivel')+(r.pri?' ★':''),r.accion,r.resp||'—',r.estado,r.etapa,r.upd]),styles:{fontSize:7,cellPadding:1.5},headStyles:{fillColor:[18,74,124]},columnStyles:{2:{cellWidth:70}}});dl(full?'Reporte_Necesidades_SI.pdf':'Matriz_Necesidades_SI.pdf',d.output('blob'))}
let PV=[];
async function onImport(f){try{const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null}),hi=rows.findIndex(r=>String(r[0]).trim()=='#');
PV=rows.slice(hi+1).filter(r=>/^\d+$/.test(String(r[0]).trim())).map(r=>norm(r.slice(0,8)));const ex=new Set(S.recs.map(r=>r.id)),W=[];PV.forEach(r=>{if(ex.has(r.id))W.push(`#${r.id}: ya existe, se omitirá.`);if(!r.dir||!r.sis||!r.nec)W.push(`#${r.id}: campos incompletos (dirección, sistema o necesidad).`);if(!r.resp)W.push(`#${r.id}: sin responsable.`)});
modal(`<h2>Vista previa de importación</h2><p>${PV.length} registros encontrados · ${PV.filter(r=>!ex.has(r.id)).length} nuevos.</p>${W.length?`<div class="card t-amarillo" style="max-height:200px;overflow:auto"><b>Advertencias (${W.length})</b><ul>${W.slice(0,60).map(x=>`<li>${e(x)}</li>`).join('')}</ul></div>`:'<p>Sin advertencias.</p>'}<div class="tw" style="margin:12px 0;max-height:220px;overflow:auto"><table style="min-width:520px"><tbody>${PV.slice(0,12).map(r=>`<tr><td>${r.id}</td><td>${e(r.dir)}</td><td>${e(r.sis)}</td></tr>`).join('')}</tbody></table></div><div class="ft"><button class="btn p" data-act="doimp">Incorporar registros</button><button class="btn" data-act="close">Cancelar</button></div>`)}catch(x){toast('No se pudo leer el archivo. Usa el formato de la matriz (.xlsx).')}}
async function doImp(){const ex=new Set(S.recs.map(r=>r.id)),n=PV.filter(r=>!ex.has(r.id));try{const b=db.batch(),A=firebase.firestore.FieldValue.arrayUnion,dd=uq(n.map(r=>r.dir)),rr=uq(n.map(r=>r.resp)),c={};n.forEach(r=>b.set(C().doc(String(r.id)),clean(r)));if(dd.length)c.dir=A(...dd);if(rr.length)c.resp=A(...rr);if(Object.keys(c).length)b.set(db.doc('config/catalogos'),c,{merge:true});await b.commit();close();toast(n.length+' registros incorporados')}catch(x){er(x)}}
document.addEventListener('click',ev=>{const t=ev.target,g=(s)=>t.closest(s);let b;
if(b=g('[data-nav]')){const k=b.dataset.nav;if(k=='nueva'){form();return}S.view=k;if(k=='matriz'||k=='consultar')S.f={};render();if(k=='consultar')S.view='consultar',render(),$('#q')?.focus();return}
if(b=g('[data-kpi]')){return go(kpis()[b.dataset.kpi][3])}
if(b=g('[data-v]'))return detail(b.dataset.v);if(b=g('[data-ed]'))return form(b.dataset.ed);if(b=g('[data-dup]'))return form(b.dataset.dup,1);if(b=g('[data-del]'))return confirmDel(b.dataset.del);
if(b=g('[data-yes]')){const r=S.recs.find(x=>x.id==b.dataset.yes);C().doc(String(r.id)).update({activo:false,upd:TODAY}).then(()=>{logE(lg(r.id,'Registro','Activo','Inactivo'));toast('Registro inactivado')},er);close();return}
if(b=g('[data-sv]'))return saveForm(+b.dataset.sv);if(b=g('[data-q]')){S.f={ids:quality().C[b.dataset.q][2].map(r=>r.id)};S.view='matriz';return render()}
if(b=g('[data-act]')){const a=b.dataset.act;if(a=='new')form();else if(a=='close')close();else if(a=='clr'){S.f={};S.inact=false;render()}else if(a=='xlsx')xlsx();else if(a=='pdf')pdf(false);else if(a=='rep')pdf(true);else if(a=='imp')$('#imp').click();else if(a=='doimp')doImp();else if(a=='out')auth.signOut();return}
if(g('#mo')&&t.id=='mo')return close();if(b=g('tr.r'))return detail(b.dataset.id)});
document.addEventListener('keydown',ev=>{if(ev.key=='Escape')close();if(ev.key=='Enter'&&ev.target.matches('tr.r'))detail(ev.target.dataset.id)});
document.addEventListener('input',ev=>{if(ev.target.id=='q'){S.f.q=ev.target.value;const p=ev.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.f){S.f[t.dataset.f]=t.type=='checkbox'?(t.checked?1:''):t.value;delete S.f.ids;render()}else if(t.id=='inact'){S.inact=t.checked;render()}else if(t.id=='imp'&&t.files[0]){onImport(t.files[0]);t.value=''}});
document.addEventListener('submit',ev=>{ev.preventDefault();const t=ev.target;if(t.id=='lf'){auth.signInWithEmailAndPassword(t.em.value.trim(),t.pw.value).catch(x=>{$('#le').textContent=['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(x.code)?'Correo o contraseña incorrectos.':'No se pudo iniciar sesión ('+x.code+').'});return}if(t.dataset.add){const v=t.v.value.trim(),k=t.dataset.add;if(v&&!S.cat[k].includes(v))db.doc('config/catalogos').set({[k]:firebase.firestore.FieldValue.arrayUnion(v)},{merge:true}).catch(er)}});
boot();
</script></body></html>
